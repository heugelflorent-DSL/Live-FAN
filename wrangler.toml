name = "schwimme-direct"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Site public et admin (fichiers statiques), l'API passe par le Worker
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Stockage des données et des réglages (créé automatiquement au premier déploiement)
[[kv_namespaces]]
binding = "KV"
id = "ccd13ef8e59b48a78992c71d83150b42"

# Récupération du Live FFN : le Worker se réveille chaque minute et respecte la fréquence choisie dans l'admin
[triggers]
crons = ["* * * * *"]

# Compte Cloudflare (identifiant public, utilisé pour lire les statistiques de fréquentation)
[vars]
CF_ACCOUNT_ID = "dc49e1d2f63a584f4af2bf4ad3297546"

[observability]
enabled = true
