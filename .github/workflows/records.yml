# Met à jour public/records.json chaque semaine (records FFN extraNat : France, Grand Est, départements)
# et la liste club → département. Jamais lu par le serveur du site (trop lourd pour l'offre gratuite).
name: Records institutionnels
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/records.mjs
      - name: Déposer le fichier sur le site
        run: |
          git config user.name "swim-direct-bot" && git config user.email "bot@users.noreply.github.com"
          git add public/records.json
          git commit -m "Records institutionnels : mise à jour hebdomadaire" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
